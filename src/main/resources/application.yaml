spring:
  application:
    name: customer_experience

  # config de DB
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  # config rabbitmq
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION}

# config espocmr
espocrm:
  base-url: ${ESPOCRM_BASE_URL}
  api-key: ${ESPOCRM_API_KEY}
